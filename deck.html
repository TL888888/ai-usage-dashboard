<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>集團AI使用月報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念:像一份「每頁一個結論」的簡報,但可以上傳 Excel 即時更新。
   色彩:冷灰底、深藍墨色文字;藍色=本月、淡藍=上月、橘色=「沒有 tokens 的使用者」。 */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #14212e;
  --ink2: #44556a;
  --muted: #6f7e8e;
  --line: #dde3e9;
  --accent: #2a78d6;        /* 本月 */
  --accent-soft: #cde2fb;
  --prev: #9ec5f4;          /* 上月 */
  --warm: #eb6834;          /* 沒有 tokens 的使用者 */
  --good: #1a7f4b;
  --bad: #c2372f;
  --warnbg: #fff4e0;
  --warnink: #8a5300;
  --tip-bg: #14212e;
  --tip-ink: #ffffff;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1720; --surface: #17212c; --ink: #eaf0f6; --ink2: #b3c0cf; --muted: #8696a8; --line: #2a3745;
    --accent: #3987e5; --accent-soft: #1c3350; --prev: #1c5cab; --warm: #d95926;
    --good: #4cc38a; --bad: #ff8a80; --warnbg: #2c2412; --warnink: #f0c36d; --tip-bg: #eaf0f6; --tip-ink: #14212e;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1720; --surface: #17212c; --ink: #eaf0f6; --ink2: #b3c0cf; --muted: #8696a8; --line: #2a3745;
  --accent: #3987e5; --accent-soft: #1c3350; --prev: #1c5cab; --warm: #d95926;
  --good: #4cc38a; --bad: #ff8a80; --warnbg: #2c2412; --warnink: #f0c36d; --tip-bg: #eaf0f6; --tip-ink: #14212e;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; padding-inline: 16px; padding-block: 0 48px; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1040px; margin-inline: auto; }
h1, h2, h3, p { margin: 0; }
button, select, input { font: inherit; color: inherit; }

/* ---- 控制列 ---- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 12px; border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.bar-in { max-width: 1040px; margin-inline: auto; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.brand { font-weight: 700; font-size: 17px; margin-right: auto; min-width: 0; }
.brand small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer; min-height: 36px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
.btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 36px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }
.switch.off { opacity: .45; cursor: not-allowed; }
.status { font-size: 13px; color: var(--ink2); min-height: 20px; padding-top: 8px; max-width: 1040px; margin-inline: auto; }
.status.err { color: var(--bad); }

/* ---- 簡報頁 ---- */
.deck { display: flex; flex-direction: column; gap: 20px; padding-block: 20px; }
.slide { scroll-margin-top: 96px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px clamp(18px, 4vw, 40px) 30px; min-width: 0; }
.kicker { font-size: 12.5px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
.slide h2 { font-size: clamp(20px, 3.4vw, 28px); line-height: 1.3; font-weight: 700; text-wrap: balance; margin-bottom: 6px; }
.lede { color: var(--ink2); margin-bottom: 22px; max-width: 70ch; }
.note { color: var(--muted); font-size: 12.5px; margin-top: 16px; max-width: 80ch; }
.cover h1 { font-size: clamp(30px, 6vw, 50px); line-height: 1.15; font-weight: 700; margin-block: 4px 8px; }
.cover .sub { color: var(--ink2); font-size: 16px; margin-bottom: 24px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.kpi .v { font-size: 30px; font-weight: 700; line-height: 1.15; }
.kpi .l { font-size: 13px; color: var(--ink2); }
.kpi .d { font-size: 12.5px; margin-top: 4px; color: var(--muted); min-height: 19px; }
.d.up { color: var(--good); } .d.down { color: var(--bad); }
.takeaway { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; color: var(--ink); max-width: 75ch; }

/* ---- 長條圖(HTML 畫) ---- */
.hbars { display: flex; flex-direction: column; gap: 14px; }
.hrow { display: grid; grid-template-columns: minmax(80px, 150px) 1fr minmax(70px, auto); gap: 6px 12px; align-items: center; }
.hrow .lab { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.hrow .val { font-size: 14px; font-weight: 500; text-align: right; white-space: nowrap; }
.hrow .lab .sub { font-size: 12px; color: var(--muted); }
.flag { color: var(--warm); font-weight: 500; }
.h3 { font-size: 15px; font-weight: 500; margin: 26px 0 8px; }
.hrow .val small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.track { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.bar-seg { height: 14px; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 2px; }
.bar-seg.prev { background: var(--prev); height: 9px; }
.stack { display: flex; height: 18px; gap: 2px; }
.stack > span { display: block; height: 100%; min-width: 0; }
.stack > span:first-child { border-radius: 0 0 0 0; }
.stack .s-a { background: var(--accent); }
.stack .s-b { background: var(--warm); }
.stack .s-c { background: var(--accent-soft); border: 1px solid var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink2); margin-bottom: 14px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.hit:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.hrow.hit { border-radius: 6px; padding-block: 3px; }

/* ---- 2026-10-07:重點數字紅字、各公司前三名卡片、上月位置直線 ---- */
.hl { color: var(--bad); }
.blue { color: var(--accent); }
.cos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .cos { grid-template-columns: 1fr; } }
.co { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.co-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 16px; }
.co-h span { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.co-h span b { font-size: 16px; }
.co-r { display: flex; justify-content: space-between; gap: 8px; }
.co-meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.co-meta span { color: var(--ink); }
.co-none small { color: var(--muted); }
.dn { color: #00a04a; }
.co-h .hl { color: var(--bad); } .co-h .dn { color: #00a04a; }
.muted { color: var(--muted); font-weight: 400; }
.co-prev { display: block; text-align: right; font-size: 12px; color: var(--muted); }
.cat-tools { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); margin-top: -4px; }
.cat-tools span { color: var(--ink2); }
.co-foot { font-size: 12.5px; color: var(--muted); margin-top: auto; padding-top: 4px; }
.hrow .val b { font-weight: 700; }
.pgroups { display: flex; flex-direction: column; }
.pgroup { border: 1px solid var(--ink2); padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
.pgroup + .pgroup { border-top: 0; }
.pgroup .hrow:not(.old) .lab, .pgroup .hrow:not(.old) .val { font-weight: 700; }
.pgroup .hrow.old .lab, .pgroup .hrow.old .val { color: var(--muted); }
.pgroup .hrow.old .stack { opacity: .45; }

/* ---- 表格 ---- */
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--ink2); background: color-mix(in srgb, var(--ink) 3%, var(--surface)); white-space: nowrap; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.heat td.c { text-align: center; min-width: 64px; }
.heat .zero { color: var(--muted); }

/* ---- 案例卡 ---- */
.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.case { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.case .who { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.case .what { overflow-wrap: anywhere; }

/* ---- 提醒 ---- */
.warns { display: flex; flex-direction: column; gap: 8px; }
.warn { background: var(--warnbg); color: var(--warnink); border-radius: 8px; padding: 10px 14px; font-size: 14px; overflow-wrap: anywhere; }
.warn.info { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); color: var(--ink2); }
.warn b { font-weight: 700; margin-right: 6px; }

/* ---- 空狀態 ---- */
.empty { text-align: left; }
.empty ol { margin: 10px 0 18px; padding-left: 22px; color: var(--ink2); }
.demo-banner { background: var(--warnbg); color: var(--warnink); border-radius: 8px; padding: 8px 14px; font-size: 13.5px; margin-top: 16px; }

/* ---- 提示泡泡 ---- */
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 13px; padding: 6px 10px; border-radius: 6px; max-width: 280px; display: none; line-height: 1.45; }

/* ---- 簡報模式 ---- */
body.present { padding: 0; overflow: hidden; }
body.present .bar, body.present .status, body.present .nopresent { display: none !important; }
body.present .deck { display: block; padding: 0; }
body.present .slide { display: none; position: fixed; inset: 0; border-radius: 0; border: 0; overflow-y: auto; padding: clamp(24px, 5vw, 64px) clamp(24px, 7vw, 100px); font-size: 17px; }
body.present .slide.current { display: block; }
body.present .slide h2 { font-size: clamp(26px, 3.6vw, 40px); }
body.present .cover h1 { font-size: clamp(40px, 7vw, 72px); }
body.dash #fileBtn, body.dash #clearBtn, body.dash .status { display: none !important; }
.pnav { display: none; }
body.present .pnav { display: flex; position: fixed; z-index: 20; right: 14px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: 13px; color: var(--ink2); }
.pnav button { background: none; border: 0; cursor: pointer; padding: 4px 10px; border-radius: 6px; }
.pnav button:hover { background: var(--bg); }

@media (max-width: 560px) {
  .hrow { grid-template-columns: 1fr minmax(60px, auto); }
  .hrow .track { grid-column: 1 / -1; order: 3; }
  .kpi .v { font-size: 26px; }
}
@media (prefers-reduced-motion: no-preference) { .bar-seg, .stack > span { transition: width .35s ease; } }
</style>

<div class="bar"><div class="bar-in">
  <div class="brand">集團 AI 使用月報<small>經營會議簡報:已載入 8、9 月資料,每月匯入新 Excel 即可更新</small></div>
  <div class="ctl"><label class="btn primary" for="file" id="fileBtn" tabindex="0">匯入 Excel</label><input id="file" type="file" accept=".xlsx,.xls" multiple hidden></div>
  <div class="ctl"><label for="month" style="color:var(--ink2);font-size:13px">月份</label><select id="month" disabled></select></div>
  <label class="switch off" id="cmpWrap"><input type="checkbox" id="cmp" disabled><span id="cmpText">與上個月比較</span></label>
  <button class="btn" id="presentBtn" disabled>簡報模式</button>
  <button class="btn" id="clearBtn" disabled>還原內建資料</button>
</div></div>
<div class="status" id="status" role="status"></div>
<div class="wrap"><main class="deck" id="deck"></main></div>
<div class="pnav" id="pnav"><button id="pPrev" aria-label="上一頁">◀</button><span id="pCount"></span><button id="pNext" aria-label="下一頁">▶</button><button id="pExit">結束簡報</button></div>
<div id="tip"></div>

<script>
/* ============================================================
 * AI用量月報 — 資料處理核心(不碰畫面,可單獨在 Node 測試)
 *
 * 輸入:各公司每月填報的 Excel(固定格式:統計月份/公司/部門/姓名/使用AI名稱/方案/使用API名稱/本月token用量/導入工作應用/備註)
 * 輸出:標準化後的紀錄、各月份彙總、資料品質提醒
 *
 * 給接手的人:要調整公司名稱對照、AI工具名稱對照、工作應用分類,只需要改下面三個設定區塊,不用動其他程式。
 * ============================================================ */

// ---------- 設定區 1:公司名稱對照(填報人寫法不一,統一成同一個公司名) ----------
// 由上往下比對,符合的第一條就採用。找不到符合時,直接使用填報的公司名稱(簡體會自動轉繁體)。
const COMPANY_ALIASES = [
  [/昆山|硕量|碩量|东莞|東莞/, '碩量'],
  [/涟水|漣水/, '漣水'],
  [/南京/, '南京'],
  [/台[灣湾]|臺[灣湾]/, '台灣']
];

// ---------- 設定區 1b:簡報上顯示的公司全名(左邊是上面標準化後的名稱) ----------
const COMPANY_DISPLAY = { '台灣': '台灣大量', '南京': '南京大量', '漣水': '漣水大量', '碩量': '碩量(昆山東莞)' };
const disp = c => COMPANY_DISPLAY[c] || c;
// 簡報上公司的排列順序(Michelle 指定:南京、台灣、漣水、碩量);不在清單裡的公司排在最後
const COMPANY_ORDER = ['南京', '台灣', '漣水', '碩量'];
const sortCompanies = list => list.slice().sort((a, b) => { const ia = COMPANY_ORDER.indexOf(a), ib = COMPANY_ORDER.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, 'zh-Hant'); });

// ---------- 設定區 2:AI工具名稱對照(小寫、去空白後比對)----------
const TOOL_ALIASES = {
  'chatgpt': 'ChatGPT', 'gpt': 'ChatGPT', 'openai': 'ChatGPT',
  'claude': 'Claude', 'claudecode': 'Claude', 'claudecli': 'Claude',
  'gemini': 'Gemini', 'notebooklm': 'NotebookLM', 'notebookllm': 'NotebookLM',
  'deepseek': 'DeepSeek', 'deppseek': 'DeepSeek', 'deepsesk': 'DeepSeek',
  'cursor': 'Cursor', 'codex': 'Codex', 'copilot': 'Copilot', 'githubcopilot': 'Copilot',
  '豆包': '豆包', '千問': '千問', 'qwen': '千問', 'kimi': 'Kimi', 'kimiai': 'Kimi',
  '元寶': '元寶', 'minimax': 'MiniMax', 'mimo': 'MiMo', 'workbuddy': 'WorkBuddy', 'codebuddy': 'CodeBuddy',
  'qclaw': 'QClaw', 'codequery': 'CodeQuery', '聽腦': '聽腦', 'grok': 'Grok'
};

// ---------- 設定區 3:工作應用分類(關鍵字,一筆應用可以同時屬於多類)----------
const PURPOSE_CATEGORIES = [
  ['資料查詢與研究', /查詢|查询|搜尋|搜索|檢索|研究|諮詢|咨詢|問答|法規|法规|尋源|寻源|資料|资料|信息|情報|學習|学习|了解|了解/],
  ['文件與文書處理', /文件|文檔|文档|文書|文书|報告|报告|整理|摘要|會議|会议|紀要|纪要|記錄|PPT|簡報|简报|表格|excel|word|合約|合同|信件|郵件|邮件/i],
  ['翻譯與語言', /翻譯|翻译|語言|语言|英文|日文|多語/],
  ['程式與軟體開發', /開發|开发|程式|程序|代碼|代码|coding|code|軟體|软件|腳本|脚本|python|vba|網頁|网页|ilogic|vb/i],
  ['數據分析與報表', /數據|数据|分析|報表|报表|統計|统计|優化|优化|bom|函數|函数/i],
  ['流程自動化', /自動|自动|一鍵|一键|批次|批量|rpa|agent|工作流|流程|整合|整合/i],
  ['客戶與商務溝通', /客戶|客户|營業|营业|商務|商务|行銷|营销|報價|报价|詢價|询价|回覆|回复/],
  ['設計與影音', /設計|设计|圖像|图像|繪圖|绘图|影片|视频|海報|海报|音訊|音频/]
];
// 判斷「自動化/進階應用」案例用的關鍵字(簡報裡「自動化案例」那一頁)
const AUTOMATION_RE = /自動|自动|一鍵|一键|批次|批量|rpa|agent|工作流|腳本|脚本|ilogic|vba|整合/i;

// ---------- 簡體轉繁體(只轉常見的公司/部門/工具/應用用字,姓名不轉)----------
const S2T_PAIRS = '涟漣硕碩营營业業务務资資财財产產总總门門质質经經体體术術宝寶关關发發应應纪紀录錄统統计計设設备備护護检檢验驗认認证證买買卖賣销銷户戶订訂单單种種类類电電脑腦软軟库庫图圖络絡网網动動态態视視频頻译譯议議论論让讓问問说說谢謝请請对對话話题題现現实實际際规規划劃试試测測报報处處员員联聯积積开開与與专專长長车車东東进進时時间間会會档檔询詢码碼简簡库庫资資寻尋导導应應该該贸貿资資仓倉储儲运運输輸购購货貨据據数數点點输輸出出库庫维維修修产產线線料料师師务務厂廠区區协協调調学學习習觉覺听聽认認确確绩績实實别別则則读讀写寫复復杂雜样樣线線结結构構优優势勢项項题題节節约約为為与與这這个個们們来來过過还還没沒从從发發现現让讓将將对對记記讯訊换換';
const S2T = (() => { const m = {}; for (let i = 0; i + 1 < S2T_PAIRS.length; i += 2) m[S2T_PAIRS[i]] = S2T_PAIRS[i + 1]; return m; })();
const toTrad = s => String(s == null ? '' : s).replace(/[一-鿿]/g, ch => S2T[ch] || ch);
const clean = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();

// ---------- token 數字解析(1B / 935.4K / 770M / 純數字 / 1.5萬 / 「A+B」相加)----------
const UNIT = { '': 1, K: 1e3, M: 1e6, B: 1e9, G: 1e9, '萬': 1e4, '万': 1e4, '億': 1e8, '亿': 1e8 };
function parseOneToken(s) {
  const m = s.replace(/,/g, '').trim().match(/^([\d.]+)\s*([KkMmBbGg萬万億亿]?)\s*(?:tokens?)?$/i);

// ---------- 月份 ----------

// ---------- 讀 Excel ----------
const HEADER_KEYS = [

  ['person', /^姓名/],

/** XLSX:SheetJS 模組;wb:XLSX.read 的結果;回傳 { records, info } */

      const t = String(c).replace(/\s+/g, '');

    });

      if (!dept && !person && !toolRaw) { info.subtotalRows++; continue; }

        person: person, tools, toolRaw: toTrad(toolRaw), plan: normPlan(g('plan')), api: toTrad(clean(g('api'))),
        tokens: tok.n, tokensRaw: tok.raw, tokenBad: !!tok.bad,
        purpose: toTrad(purpose), cats: classifyPurpose(purpose), isAuto: AUTOMATION_RE.test(toTrad(purpose)),
        note: toTrad(clean(g('note'))), src: `${name}#${i + 1}`

// ---------- 彙總 ----------
const personKey = r => `${r.company}|${r.dept}|${r.person}`;

  rows.forEach(r => { const k = personKey(r); if (!persons.has(k)) persons.set(k, []); persons.get(k).push(r); });

    people: persons.size, depts: depts.size, tokenPeople, noTokenPeople: persons.size - tokenPeople,
    purposePeople, paidPeople, freePeople: persons.size - paidPeople, tokens, badTokens,

function listMonths(records) { return [...new Set(records.map(r => r.month))].sort(); }

// ---------- 部門明細 ----------
function deptDetail(rows) {

    const s = summarizeCompany(rs);
    const topCats = Object.entries(s.cats).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => e[0]);
    const topTools = Object.entries(s.tools).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => e[0]);

// ---------- tokens 在哪些部門、用在哪裡 ----------

    const rs = rows.filter(r => r.company === c);

    } else { state.records = EMBEDDED.records.slice(); state.info = EMBEDDED.info; }
  }
  function setStatus(msg, err) { const el = $('status'); el.textContent = msg || ''; el.classList.toggle('err', !!err); }

  // ---------- 匯入新的 Excel ----------
  async function importFiles(files) {
    if (!files.length) return;
    if (typeof XLSX === 'undefined') { setStatus('讀取 Excel 的元件沒有載入,請確認網路後重新整理頁面。', true); return; }
    const merged = { subtotalRows: 0, monthMismatch: [], skippedSheets: [], sheets: [] }; const incoming = [];
    try {
      for (const f of files) {
        const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
        const { records, info } = parseWorkbook(XLSX, wb);
        records.forEach(r => { r.person = r.company + r.dept + r.person; incoming.push(r); });
        merged.subtotalRows += info.subtotalRows; merged.monthMismatch.push(...info.monthMismatch.map(m => ({ ...m, person: '' }))); merged.skippedSheets.push(...info.skippedSheets);
      }
    } catch (e) { setStatus('讀取失敗:' + (e && e.message ? e.message : e) + '。請確認是填報用的 Excel 檔。', true); return; }
    if (!incoming.length) { setStatus('這個檔案裡找不到填報資料(需要有「統計月份」「公司」欄位的工作表)。', true); return; }
    // 為了不在畫面或暫存裡留下姓名,匯入時把姓名換成代號(只用來判斷「是不是同一個人」)
    const ids = new Map(); incoming.forEach(r => { if (!ids.has(r.person)) ids.set(r.person, 'U' + (ids.size + 1)); r.person = ids.get(r.person); r.note = ''; });
    const touched = new Set(incoming.map(keyOf));
    importedOnly = importedOnly.filter(r => !touched.has(keyOf(r))).concat(incoming);
    state.records = EMBEDDED.records.filter(r => !touched.has(keyOf(r))).concat(importedOnly);
    state.info = merged; save(importedOnly);
    setStatus(`已匯入 ${incoming.length} 筆(${[...new Set(incoming.map(r => disp(r.company)))].join('、')};${listMonths(incoming).map(monthShort).join('、')})。同公司同月份已用新資料取代。`);
    const ms = listMonths(state.records); state.month = ms[ms.length - 1]; state.compare = !!prevMonthOf(state.records, state.month);
    render();
  }

  // ---------- 小工具 ----------
  function delta(cur, prev, unit) {
    if (prev == null) return '';
    const d = cur - prev; if (d === 0) return `<span class="d">與${esc(state._prevShort)}持平</span>`;
    return `<span class="d ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲ +' : '▼ '}${d}${unit || ''} 較${esc(state._prevShort)}</span>`;
  }
  const tipAttr = t => ` data-tip="${esc(t)}"`;
  function hbars(items, opt) {
    opt = opt || {};
    const max = Math.max(1e-9, ...items.flatMap(i => [i.cur, i.prev || 0]));
    const fmt = opt.fmt || (v => v + (opt.unit || ''));
    return `<div class="hbars">` + items.map(i => {
      const w = v => Math.max(0, v / max * 100).toFixed(1);
      const hasPrev = state.compare && i.prev != null;
      const tip = `${i.label}:${state._curShort} ${fmt(i.cur)}` + (hasPrev ? `;${state._prevShort} ${fmt(i.prev)}` : '');
      return `<div class="hrow hit"${tipAttr(tip)}><div class="lab">${esc(i.label)}${i.sub ? `<div class="sub">${i.sub}</div>` : ''}</div><div class="track"><div class="bar-seg" style="width:${w(i.cur)}%"></div>${hasPrev ? `<div class="bar-seg prev" style="width:${w(i.prev)}%"></div>` : ''}</div><div class="val">${fmt(i.cur)}${i.valSub ? `<small>${i.valSub}</small>` : ''}${hasPrev ? `<small>${esc(state._prevShort)} ${fmt(i.prev)}</small>` : ''}</div></div>`;
    }).join('') + `</div>`;
  }
  const slide = (kicker, title, lede, body, extra) => `<section class="slide ${extra || ''}"><div class="kicker">${esc(kicker)}</div><h2>${title}</h2>${lede ? `<p class="lede">${lede}</p>` : ''}${body}</section>`;
  const legendCmp = () => state.compare ? `<div class="legend"><span><i style="background:var(--accent)"></i>${esc(state._curShort)}</span><span><i style="background:var(--prev)"></i>${esc(state._prevShort)}(上月)</span></div>` : '';
  const catShort = n => n.replace('與', '/');

  // ---------- 簡報各頁 ----------
  function build() {
    const m = state.month, pm = prevMonthOf(state.records, m);
    const cur = summarizeMonth(state.records, m);
    const prev = (state.compare && pm) ? summarizeMonth(state.records, pm) : null;
    state._curShort = monthShort(m); state._prevShort = pm ? monthShort(pm) : '';
    const A = cur.all, P = prev ? prev.all : null;
    const noTok = A.people - A.tokenPeople;
    const slides = [];

    // 公司依 COMPANY_ORDER 排列(南京、台灣、漣水、碩量)
    const tops = companyTopDepts(cur.rows, 3);
    const byTok = tops.slice().sort((a, b) => b.tokens - a.tokens);
    const topCo = byTok[0];
        const hl = s => `<span class="hl">${s}</span>`;

    // ---- 第 1 頁:集團 tokens 合計 + 各公司前三名部門(與 PowerPoint 第1頁相同,Michelle 2026-10-07 定稿) ----
    // 排名規則見 core.js companyTopDepts。各公司與上月比較只用箭頭(紅▲、綠▼)+ 灰字上月數字,不寫 %。
    const up = P && P.tokens && A.tokens >= P.tokens;
    slides.push(slide('集團各公司 AI 使用統計', `${esc(state._curShort)}集團 tokens 合計 ${hl(fmtTokens(A.tokens))}${up ? `,較${esc(state._prevShort)} ${hl('▲' + Math.round((A.tokens / P.tokens - 1) * 100) + '%')}` : ''}`,
      `以下統計集團 ${A.companies} 家公司、${A.depts} 個部門填報,依公司別列出 tokens${topCo && topCo.tokens ? `,<b>${esc(state._curShort)}${esc(disp(topCo.company))}占 ${pctOf(topCo.tokens, A.tokens)}%</b>` : ''}。`,
      `<div class="cos">` + tops.map(t => {
        const q = prev && prev.byCompany[t.company];
        const arrow = q && t.tokens !== q.tokens && (t.tokens || q.tokens) ? (t.tokens > q.tokens ? '<span class="hl">▲</span>' : '<span class="dn">▼</span>') : '';
        const head = `<div class="co-h"><b>${esc(disp(t.company))}</b><span>${arrow}合計 <b class="${t.tokens ? 'blue' : ''}">${t.tokens ? fmtTokens(t.tokens) : '—'}</b>${q ? `<small class="co-prev">${esc(state._prevShort)} ${q.tokens ? fmtTokens(q.tokens) : '—'}</small>` : ''}</span></div>`;
        const foot = t.restDepts ? `另有 ${t.restDepts} 個部門、${t.restPeople} 人填報${t.restTokens > 0 ? `,tokens 合計 ${fmtTokens(t.restTokens)}` : ''}` : '';
        return `<div class="co">${head}` + t.top.map((d, k) => `<div class="co-r"><span><b class="blue">${k + 1}</b> <b>${esc(d.dept)}</b> <small class="muted">${d.people} 人填報</small></span>${d.noTok ? '<small class="muted">網頁版/免費</small>' : `<b>${fmtTokens(d.tokens)}</b>`}</div>`).join('') + (foot ? `<div class="co-foot">${esc(foot)}</div>` : '') + `</div>`;
      }).join('') + `</div>`));

    // ---- 第 2 頁:tokens 用在哪裡(依導入工作應用分類,每一類註明使用的 AI 工具;「其他」排最後) ----
    const catTok = tokenByCategory(cur.rows), catTotal = catTok.reduce((a, c) => a + c.tokens, 0), maxCat = Math.max(1, ...catTok.map(c => c.tokens));
    const lead = catTok.filter(c => !/^其他/.test(c.cat))[0];
    slides.push(slide('tokens 用在哪裡', lead ? `${hl(esc(lead.cat))} 占 tokens 的 ${pctOf(lead.tokens, catTotal)}%` : '本月沒有 tokens 資料', '依各部門填寫的「導入工作應用」歸類,並註明使用的 AI 工具。',
      `<div class="hbars">` + catTok.map(c => `<div class="hrow hit"${tipAttr(`${c.cat}:${fmtTokens(c.tokens)}(占 ${pctTxt(c.tokens, catTotal)});AI 工具:${c.tools.join('、')}`)}><div class="lab">${esc(c.cat)}</div><div class="track"><div class="bar-seg" style="width:${(c.tokens / maxCat * 100).toFixed(1)}%"></div></div><div class="val">${fmtTokens(c.tokens)}<small>占 ${pctTxt(c.tokens, catTotal)}</small></div><div class="cat-tools">AI 工具:<span>${esc(c.tools.slice(0, 5).join('、') || '—')}</span></div></div>`).join('') + `</div>` +
      `<p class="note">一筆填寫若同時屬於好幾類,tokens 平均分配到各類;「其他」為有 tokens 但未填導入工作應用。</p>`));

    // ---- 第 3 頁:填報使用 AI 人數(每家公司一個框:本月深色、上月淺色;照 Michelle 在 PowerPoint 調整的版面) ----
    const maxN = Math.max(1, ...tops.map(t => Math.max(t.people, prev && prev.byCompany[t.company] ? prev.byCompany[t.company].people : 0)));
    const pRow = (label, s, old) => `<div class="hrow hit${old ? ' old' : ''}"${tipAttr(`${label}:${s.people} 人(有 tokens 數字 ${s.tokenPeople}、網頁版或免費工具 ${s.noTokenPeople})`)}><div class="lab">${esc(label)}</div><div class="track"><div class="stack" style="width:${(s.people / maxN * 100).toFixed(1)}%"><span class="s-a" style="flex:${s.tokenPeople}"></span><span class="s-b" style="flex:${s.noTokenPeople}"></span></div></div><div class="val">${s.people} 人</div></div>`;
    slides.push(slide('填報使用 AI 人數', `${A.people} 人填報使用 AI${P && A.people > P.people ? `,較${esc(state._prevShort)}${hl('▲' + (A.people - P.people) + '人')}` : ''}`, `其中 ${noTok} 人使用網頁版或免費工具,tokens 無法統計,因此另以工作應用呈現。`,
      `<div class="legend"><span><i style="background:var(--accent)"></i>有 tokens 數字</span><span><i style="background:var(--warm)"></i>使用網頁版或免費工具(無 tokens 數字)</span></div><div class="pgroups">` +
      tops.map(t => { const q = prev && prev.byCompany[t.company]; return `<div class="pgroup">${pRow(`${disp(t.company)} ${state._curShort}`, cur.byCompany[t.company], false)}${q ? pRow(`${disp(t.company)} ${state._prevShort}`, q, true) : ''}</div>`; }).join('') + `</div>`));

    // ---- 使用工具(PowerPoint 版已不放這頁,系統裡保留供參考) ----
    const byPeople = cur.companies.slice().sort((a, b) => cur.byCompany[b].people - cur.byCompany[a].people);
    const toolNames = Object.keys(A.tools).sort((a, b) => A.tools[b] - A.tools[a]).slice(0, 10);
    const maxC = Math.max(1, ...byPeople.map(c => cur.byCompany[c].people));
    slides.push(slide('使用的 AI 工具', toolNames[0] ? `${esc(toolNames[0])} 最多人用,共 ${A.tools[toolNames[0]]} 人` : '本月沒有工具資料', `各 AI 工具的使用人數(一個人用多個工具會各算一次),以及付費與免費的比例。`,
      legendCmp() + hbars(toolNames.map(t => ({ label: t, cur: A.tools[t], prev: P ? (P.tools[t] || 0) : null })), { unit: ' 人' }) +
      `<h3 class="h3">付費與免費使用者</h3><div class="legend"><span><i style="background:var(--accent)"></i>付費方案(月費、年費、額度制)</span><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>免費方案</span></div><div class="hbars">` +
      byPeople.map(c => { const b = cur.byCompany[c]; const q = prev && prev.byCompany[c]; return `<div class="hrow hit"${tipAttr(`${disp(c)}:付費 ${b.paidPeople} 人、免費 ${b.freePeople} 人`)}><div class="lab">${esc(disp(c))}</div><div class="track"><div class="stack" style="width:${(b.people / maxC * 100).toFixed(1)}%"><span class="s-a" style="flex:${b.paidPeople}"></span><span class="s-c" style="flex:${b.freePeople}"></span></div></div><div class="val">${b.paidPeople} / ${b.freePeople}${q ? `<small>${esc(state._prevShort)} ${q.paidPeople} / ${q.freePeople}</small>` : ''}</div></div>`; }).join('') + `</div><p class="note">右側數字是「付費人數 / 免費人數」。</p>`));

    return slides;
  }

  // ---------- 畫面 ----------
  function render() {
    const sel = $('month'), cmp = $('cmp');
    const months = listMonths(state.records);
    if (!months.length) { $('deck').innerHTML = DASHBOARD ? `<section class="slide"><h2>還沒有資料</h2><p class="lede">請先到「集團各公司統計」匯入月報表 Excel,這裡就會自動產生簡報。</p></section>` : `<section class="slide"><h2>還沒有資料</h2><p class="lede">按上方「匯入 Excel」選擇填報檔案。</p></section>`; return; }
    if (!state.month || !months.includes(state.month)) state.month = months[months.length - 1];
    sel.innerHTML = months.map(x => `<option value="${x}" ${x === state.month ? 'selected' : ''}>${monthLabel(x)}</option>`).join(''); sel.disabled = false;
    const pm = prevMonthOf(state.records, state.month);
    cmp.disabled = !pm; $('cmpWrap').classList.toggle('off', !pm);
    if (!pm) state.compare = false;
    cmp.checked = state.compare;
    $('cmpText').textContent = pm ? `與上個月(${monthShort(pm)})比較` : '與上個月比較(沒有上個月資料)';
    $('presentBtn').disabled = false; $('clearBtn').disabled = !importedOnly.length;
    $('deck').innerHTML = build().join('');
    updateCurrent();
  }

  // ---------- 簡報模式 ----------
  const slideEls = () => [...document.querySelectorAll('#deck .slide')].filter(s => !s.classList.contains('nopresent'));
  function updateCurrent() {
    const els = slideEls(); document.querySelectorAll('#deck .slide').forEach(s => s.classList.remove('current'));
    if (!els.length) return; state.cur = Math.min(Math.max(state.cur, 0), els.length - 1); els[state.cur].classList.add('current');
    $('pCount').textContent = `${state.cur + 1} / ${els.length}`;
  }
  function enterPresent() { document.body.classList.add('present'); state.cur = 0; updateCurrent(); try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} }
  function exitPresent() { document.body.classList.remove('present'); try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {} }
  function go(d) { state.cur += d; updateCurrent(); const c = document.querySelector('#deck .slide.current'); if (c) c.scrollTop = 0; }
  document.addEventListener('keydown', e => {
    if (!document.body.classList.contains('present')) return;
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(1); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(-1); }
    else if (e.key === 'Escape') exitPresent();
  });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('present')) exitPresent(); });

  // ---------- 事件 ----------
  $('file').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; importFiles(fs); });
  $('fileBtn').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
  $('month').addEventListener('change', e => { state.month = e.target.value; render(); });
  $('cmp').addEventListener('change', e => { state.compare = e.target.checked; render(); });
  $('presentBtn').addEventListener('click', enterPresent);
  $('pExit').addEventListener('click', exitPresent);
  $('pPrev').addEventListener('click', () => go(-1));
  $('pNext').addEventListener('click', () => go(1));
  let clearArm = 0;
  $('clearBtn').addEventListener('click', () => {
    if (!clearArm) { clearArm = 1; $('clearBtn').textContent = '再按一次確認'; setTimeout(() => { clearArm = 0; $('clearBtn').textContent = '還原內建資料'; }, 4000); return; }
    clearArm = 0; $('clearBtn').textContent = '還原內建資料'; importedOnly = [];
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    state.records = EMBEDDED.records.slice(); state.info = EMBEDDED.info; state.month = null; setStatus('已移除你匯入的資料,還原成內建資料。'); init2(); render();
  });
  ['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => { if (e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files')) { e.preventDefault(); if (ev === 'drop') importFiles([...e.dataTransfer.files].filter(f => /\.xlsx?$/i.test(f.name))); } }));
  const tip = $('tip');
  document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) { tip.style.display = 'none'; return; } tip.textContent = t.getAttribute('data-tip'); tip.style.display = 'block'; });
  document.addEventListener('mousemove', e => { if (tip.style.display === 'block') { const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8); tip.style.left = Math.max(8, x) + 'px'; tip.style.top = (e.clientY + 16) + 'px'; } });
  window.__aiReport = { importBuffer: async (buf, name) => importFiles([{ name: name || 'test.xlsx', arrayBuffer: async () => buf }]), state };

  function init2() { const ms = listMonths(state.records); state.month = ms[ms.length - 1]; state.compare = !!prevMonthOf(state.records, state.month); }
  if (DASHBOARD) { document.body.classList.add('dash'); const sm = document.querySelector('.brand small'); if (sm) sm.textContent = '資料來自「集團各公司統計」匯入的月報表'; }
  else { init(); init2(); }
  window.AiReport = {
    setDbRows(rows) {
      const keepMonth = state.month;
      state.records = (rows || []).map((x, i) => CORE.recordFromDbRow(x, i)).filter(x => /^\d{4}-\d{2}$/.test(x.month));
      const ms = listMonths(state.records);
      state.month = ms.includes(keepMonth) ? keepMonth : ms[ms.length - 1];
      state.compare = state.compare || !!prevMonthOf(state.records, state.month);
      render();
    }
  };
  if (!DASHBOARD && EMBEDDED.records.length && !importedOnly.length) setStatus(`已載入內建資料:${listMonths(EMBEDDED.records).map(monthLabel).join('、')}。每月匯入新的 Excel 就會加進來。`);
  render();
})();

</script>

</body></html>
